name: CI

# Runs on every push and pull request. The absence of this workflow is why a commit
# that did not compile reached main unnoticed.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Integration tests use Testcontainers and skip themselves when no daemon is
      # reachable. Asserting Docker is present means that escape hatch cannot quietly
      # hide them here.
      - name: Verify Docker is available
        run: docker info > /dev/null

      # spotless:check is bound to validate, so unformatted code fails here.
      - name: Build, verify formatting, and test
        working-directory: backend
        run: mvn -B verify

      - name: Confirm integration tests actually ran
        working-directory: backend
        run: |
          if grep -rl 'skipped="[1-9]' target/surefire-reports/*.xml 2>/dev/null; then
            echo "::error::Integration tests were skipped. Docker was unavailable in CI."
            exit 1
          fi
          echo "No skipped tests."

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Fails the build on a high-severity advisory rather than leaving it to be
      # noticed by hand.
      - name: Audit dependencies
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

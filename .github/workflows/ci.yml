name: CI

# Runs on every push and pull request.
#
# The backend job was removed at the repository owner's request: the repo is connected
# directly to Cloud Build, which builds and deploys on push to dev. Note that Cloud Build
# runs `mvn clean package -DskipTests`, so nothing currently executes the backend test
# suite -- `cd backend && mvn verify` has to be run by hand. Restoring the job means
# re-adding a step that runs `mvn -B verify` on a JDK 21 runner with Docker available
# (the integration tests use Testcontainers).
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Fails the build on a high-severity advisory rather than leaving it to be
      # noticed by hand.
      - name: Audit dependencies
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ============================================================================
# TEST PROFILE
# Datasource properties are supplied at runtime by the Testcontainers
# @ServiceConnection in AbstractIntegrationTest, so none appear here.
# These are dummy credentials for beans that require configuration to exist.
# ============================================================================

# Low-entropy on purpose. It only has to clear the 32-byte HS256 length check, and a
# high-entropy string on a line named jwt.secret trips secret scanners regardless of
# whether it is real. Repetition keeps it obviously fake.
jwt.secret=not-a-secret-not-a-secret-not-a-secret-not-a-secret
app.google.client-id=test-client-id.apps.googleusercontent.com

razorpay.key.id=rzp_test_dummy
razorpay.key.secret=not-a-secret
razorpay.webhook.secret=not-a-secret
app.payments.mock-enabled=true

resend.api-key=not-a-secret
resend.from-address=test@example.com

app.base-url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173

# Flyway owns the schema; validate against it rather than letting Hibernate alter it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.repair-on-migrate=false

# Keep scheduled cleanup jobs out of test runs.
spring.task.scheduling.pool.size=1
app.admin.bootstrap-email=

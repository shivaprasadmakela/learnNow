# Server Configuration
server.port=${PORT:8080}

# Active Profile Configuration
spring.profiles.active=local

# JPA Common Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# Flyway Migration Configuration
spring.flyway.repair-on-migrate=true
spring.flyway.baseline-on-migrate=true

# Hibernate JDBC Batching & Performance Optimization
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# JWT Symmetric Signature Secret
jwt.secret=${JWT_SECRET}

# Google OAuth2 Client Configuration
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Razorpay Payment Gateway Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:placeholder_secret}
# CORS Configuration
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Server Configuration
server.port=${PORT:8080}

# Active profile is supplied by the environment (SPRING_PROFILES_ACTIVE).
# It is deliberately NOT hardcoded here: a default of "local" would otherwise
# follow the jar into production and activate development fallbacks there.

# Trust proxy-supplied forwarding headers only via the framework's own filter,
# so X-Forwarded-For cannot be spoofed by arbitrary clients.
server.forward-headers-strategy=framework

# Schema resolution.
#
# The database sits behind a transaction pooler (Neon's -pooler endpoint), which reuses server
# connections between sessions. A SET issued by any client can therefore be inherited by another,
# so search_path is not something this application can assume anything about. Both settings below
# make schema resolution explicit rather than inherited:
#
#   - connection-init-sql runs on every connection Hikari opens, so JPA's unqualified table names
#     always resolve, whatever state the pooler hands over.
#   - flyway.schemas tells Flyway directly instead of having it infer from search_path, which it
#     refuses to do when the path is empty ("Unable to determine current schema").
#
# Both are correct against a direct connection too, so local development behaves identically.
spring.datasource.hikari.connection-init-sql=SET search_path TO public
spring.flyway.schemas=public
spring.flyway.default-schema=public

# JPA Common Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway Migration Configuration
# Strict by default. Local development relaxes these in application-local.properties;
# repair must always be a deliberate manual operation, never a startup side effect.
spring.flyway.validate-on-migrate=true
spring.flyway.repair-on-migrate=false
spring.flyway.baseline-on-migrate=false

# Hibernate JDBC Batching & Performance Optimization
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Actuator health probes.
#
# Served on the application port, not a separate one. Cloud Run routes exactly one
# port, so a second connector is unreachable from outside while still costing a
# thread pool and heap in a 512 MiB container. Only health and info are exposed,
# details are hidden, and everything except /actuator/health/** requires a token
# (see SecurityConfig) so this is not a public information leak.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.db.enabled=true

# --- Required configuration -------------------------------------------------
# Every value below is mandatory and has no fallback on purpose: the application
# must fail to start rather than run with a placeholder or a shared development
# secret. Supply them through the environment or a secret manager.

# JWT symmetric signature secret (min 32 bytes; base64 of 32 random bytes is ideal)
jwt.secret=${JWT_SECRET}

# Google OAuth2 client id - required, and enforced as the token audience
app.google.client-id=${GOOGLE_CLIENT_ID}

# Razorpay Payment Gateway
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
# Webhook signing secret from the Razorpay dashboard. Webhooks are refused without it.
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

# Payment gateway mocking. Never enable outside local development: when true,
# payment signatures are accepted without verification.
app.payments.mock-enabled=false

# Transactional email
resend.api-key=${RESEND_API_KEY}
resend.from-address=${RESEND_FROM_ADDRESS}

# Public base URL of the frontend, used to build email links
app.base-url=${APP_BASE_URL}

# Promotes this existing account to ADMIN on startup. Leave blank to disable.
app.admin.bootstrap-email=${ADMIN_BOOTSTRAP_EMAIL:}

# Reported by /api/health. Set from the CI build so a deploy is identifiable.
app.version=${APP_VERSION:dev}

# Access token lifetime. Short by design; renewal goes through /api/auth/refresh.
app.security.access-token-ttl-minutes=${ACCESS_TOKEN_TTL_MINUTES:30}

# CORS: comma-separated list of exact origins. Wildcards are rejected at startup.
app.cors.allowed-origins=${ALLOWED_ORIGINS}

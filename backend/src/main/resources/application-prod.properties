# ============================================================================
# PRODUCTION PROFILE
# Every credential comes from the environment. No fallbacks.
# ============================================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# Flyway strictly validates; schema changes only ever arrive as migrations.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.validate-on-migrate=true
spring.flyway.repair-on-migrate=false
spring.flyway.baseline-on-migrate=false

# HikariCP tuning for a 1 CPU / 512 MiB container
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# Payment mocking is impossible in production.
app.payments.mock-enabled=false

spring.jpa.show-sql=false

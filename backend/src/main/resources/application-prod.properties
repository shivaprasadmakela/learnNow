# Database Configuration for Production
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# In production, Flyway handles migrations cleanly and strictly validates schema integrity
spring.jpa.hibernate.ddl-auto=none
spring.flyway.validate-on-migrate=true
spring.flyway.repair-on-migrate=false

# Production Security & CORS
app.cors.allowed-origins=${ALLOWED_ORIGINS:https://learnnow.com}
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
jwt.secret=${JWT_SECRET}
resend.api-key=${RESEND_API_KEY:}
resend.from-address=${RESEND_FROM_ADDRESS:onboarding@resend.dev}
app.google.client-id=${GOOGLE_CLIENT_ID:}


